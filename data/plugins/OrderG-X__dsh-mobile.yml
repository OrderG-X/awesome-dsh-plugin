name: OrderG-X/dsh-mobile
category: remote
tarball: https://github.com/OrderG-X/dsh-mobile/releases/latest/download/dsh-mobile.tgz
description:
  en: "Use DSH from a phone browser. Turn on phone access on the plugin's settings card and scan the QR code; the phone opens the official DSH web UI served by the desktop process, with the same sessions updating live, so you can follow a running task, reply and approve away from the computer. A gateway inside DSH (port 18765) proxies the web UI and handles the desktop login itself. On the same Wi-Fi the phone connects directly; a free Cloudflare quick tunnel (cloudflared, downloaded on request) adds HTTPS access from anywhere. Pairing codes are one-time and expire in 10 minutes, each phone gets its own revocable credential, and idle connections get keepalive pings."
  zh: "在手机浏览器里用 DSH。在插件设置卡上打开手机访问、扫二维码，手机就打开电脑上 DSH 进程提供的官方网页界面，会话相同、实时同步，人不在电脑前也能跟进正在跑的任务、回消息、点批准。DSH 里内置一个网关（端口 18765）转发网页界面，并替手机处理桌面端登录。同一 Wi-Fi 下手机直连；开启 Cloudflare 免费快速隧道（cloudflared，点了才下载）后在外面也能用 HTTPS 访问。配对码一次性、10 分钟过期，每台手机一张凭证、可随时移除，空闲连接自动保活。"
