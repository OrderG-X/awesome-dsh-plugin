name: OrderG-X/dsh-chrome-bridge#plugin
category: browser
tarball: https://github.com/OrderG-X/dsh-chrome-bridge/releases/latest/download/dsh-chrome-bridge.tgz
description:
  en: "macOS only. Controls the Chrome you are already logged into, over native messaging and chrome.debugger instead of a listening port. Ships 9 browser_* tools and a cb CLI, dispatches real CDP input events, and draws an on-page cursor that also appears in screenshots. The native host and the MV3 extension travel inside this tarball: on first load the plugin copies them into place and writes the native-messaging registration itself, so there is no clone, no install.sh and no python3 - installing is one command plus one click, loading the unpacked extension once at chrome://extensions, which Chrome 137+ no longer lets anything automate. On non-macOS systems the plugin reports that limitation instead of failing silently; until the extension is loaded, browser_* tools fail loudly with the exact remaining steps."
  zh: "仅 macOS。操作你已经登录的 Chrome：走 native messaging 与 chrome.debugger，不开监听端口。提供 9 个 browser_* 原生工具和一个 cb 命令行，发送真实 CDP 输入事件，并绘制会出现在截图里的页内光标。宿主（原生宿主 + MV3 扩展）随本 tarball 一起发：插件首次加载时自己把它们落盘并写好 native messaging 注册，不用 clone 仓库、不用 install.sh、不用 python3——所以安装是一条命令加一次点选：到 chrome://extensions 加载一次已解压的扩展，这一步 Chrome 137+ 起谁都自动化不了。非 macOS 系统上插件会明确报出这个限制，不会静默失败；没加载扩展之前 browser_* 会带着剩下要做的步骤明确报错。"
